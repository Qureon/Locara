<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F58220"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shield Contour -->
  <path d="M60 10 L102 24 C102 68 76 98 60 110 C44 98 18 68 18 24 L60 10 Z" 
        stroke="url(#shieldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Inner Protective Layer -->
  <path d="M60 20 L92 31 C92 65 72 88 60 98 C48 88 28 65 28 31 L60 20 Z" 
        fill="#0F172A" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Geometric 'L' Monogram (Locara Engine · Qureon) -->
  <path d="M44 36 V76 H76" 
        stroke="url(#shieldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Self-Healing Crosshair Reticle -->
  <circle cx="60" cy="58" r="8" stroke="url(#glowGrad)" stroke-width="2.5" fill="none"/>
  <circle cx="60" cy="58" r="2.5" fill="#F58220"/>

  <line x1="60" y1="44" x2="60" y2="48" stroke="#F58220" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="68" x2="60" y2="72" stroke="#F58220" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="58" x2="50" y2="58" stroke="#F58220" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="58" x2="74" y2="58" stroke="#F58220" stroke-width="2" stroke-linecap="round"/>
</svg>
